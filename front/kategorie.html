<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategorie</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #0a2a66;
        padding: 16px;
        color: #f2f6ff;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    @media (max-width: 767px) {
        .grid {
            grid-template-columns: 1fr;
        }
    }

    .tile {
        display: block;
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1; 
        overflow: hidden;
        border-radius: 12px;
        background: #8bbdf7;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        transition: transform 0.2s ease;
        text-decoration: none;
    }

    .tile:hover {
        transform: scale(1.03);
    }

    .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .tile-title {
        position: absolute;
        bottom: 0;
        width: 100%;
        background: rgba(0,0,0,0.5);
        color: white;
        text-align: center;
        padding: 6px;
        font-size: 14px;
    }

    @media (min-width: 768px) {
        .grid {
            gap: 16px;
        }
    }
</style>
</head>

<body>

<div class="grid">

    <a href="category_1.html" class="tile">
        <img src="img1.jpg" alt="">
        <div class="tile-title">Poziom rejonu umocnionego</div> # % odwiedzenia danego rejonu umocnionego/frontowego
    </a>

    <a href="category_2.html" class="tile">
        <img src="img2.jpg" alt="">
        <div class="tile-title">Fanatyk</div> #ilośc odwiedzonych zabytkó danego tyu
    </a>

    <a href="category_3.html" class="tile">
        <img src="img3.jpg" alt="">
        <div class="tile-title">Historyk</div> #bunkry z danego okresu
    </a>

    <a href="category_4.html" class="tile">
        <img src="img4.jpg" alt="">
        <div class="tile-title">Podróżnik</div> #przebyty dystans
    </a>

    <a href="category_5.html" class="tile">
        <img src="img5.jpg" alt="">
        <div class="tile-title">Kartograf</div> #nanoszenie zmian na mapie
    </a>

    <a href="category_6.html" class="tile">
        <img src="img6.jpg" alt="">
        <div class="tile-title">Inżynier</div> #dane modele bunkrów
    </a>

    <a href="category_7.html" class="tile">
        <img src="img7.jpg" alt="">
        <div class="tile-title">Światowiec</div> #odwiedzanie krajów
    </a>

</div>

</body>
</html>
